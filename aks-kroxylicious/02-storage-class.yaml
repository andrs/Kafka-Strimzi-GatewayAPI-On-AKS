###############################################################################
# StorageClass — Azure Managed Disks with Retain policy
#
# Based on AKS default "managed-csi" but with:
#   - reclaimPolicy: Retain  (PVs survive PVC deletion)
#   - volumeBindingMode: WaitForFirstConsumer  (schedule-aware provisioning)
###############################################################################
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-retain
provisioner: disk.csi.azure.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  skuName: StandardSSD_LRS
