###############################################################################
# Kafka Cluster — KRaft mode with internal TLS listener for Kroxylicious
#
# Listener "tls":
#   - type: internal (reachable within the K8s cluster)
#   - port: 9093 with TLS enabled
#   - SCRAM-SHA-512 authentication (passes through Kroxylicious transparently)
#
# Kroxylicious connects to this listener via strimziKafkaRef and handles
# all external exposure, metadata rewriting, and TLS termination at L7.
#
# No per-broker advertisedHost is needed — Kroxylicious rewrites metadata
# automatically in Kafka protocol responses.
###############################################################################
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: gateway-api-kafka
  namespace: strimzi
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    authorization:
      type: simple
    listeners:
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        type: scram-sha-512
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
    version: 4.1.0
