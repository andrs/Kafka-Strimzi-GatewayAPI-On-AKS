###############################################################################
# KafkaUser (SCRAM-SHA-512) + KafkaTopics with production-grade config
#
# Topic configuration:
#   retention.ms:        604800000 (7 days)
#   min.insync.replicas: 2 (tolerates 1 broker failure)
#   segment.ms:          86400000 (24 hours)
#   segment.bytes:       varies per topic (10 MB or 1 GB)
###############################################################################

# --- User with full ACLs ---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: kafka-test-user
  namespace: strimzi
  labels:
    strimzi.io/cluster: gateway-api-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: "*"
        patternType: literal
      operations:
        - 'All'
      host: "*"
    - resource:
        type: group
        name: "*"
        patternType: literal
      operations:
        - 'All'
      host: "*"
    - resource:
        type: cluster
      operations:
        - 'All'
    - resource:
        type: transactionalId
        name: "*"
        patternType: literal
      operations:
        - 'All'

---
# --- Test topic (high-throughput, 10 MB segments) ---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: test-topic
  namespace: strimzi
  labels:
    strimzi.io/cluster: gateway-api-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"
    min.insync.replicas: "2"
    segment.ms: "86400000"
    segment.bytes: "10485760"

---
# --- Events topic (large segments for bulk data) ---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: events
  namespace: strimzi
  labels:
    strimzi.io/cluster: gateway-api-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"
    min.insync.replicas: "2"
    segment.ms: "86400000"
    segment.bytes: "1073741824"

---
# --- Orders topic (large segments for transactional data) ---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders
  namespace: strimzi
  labels:
    strimzi.io/cluster: gateway-api-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"
    min.insync.replicas: "2"
    segment.ms: "86400000"
    segment.bytes: "1073741824"
