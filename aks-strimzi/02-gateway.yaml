###############################################################################
# Gateway — listens on port 9092 with TLS Passthrough
#
# The Envoy proxy terminates nothing; TLS is passed through to Kafka brokers.
# SNI-based routing (via TLSRoutes) directs traffic to the correct broker.
###############################################################################
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kafka-gateway
  namespace: strimzi
spec:
  gatewayClassName: kafka-gateway-class
  listeners:
  - name: kafka-listener
    protocol: TLS
    port: 9092
    tls:
      mode: Passthrough
