###############################################################################
# Kafka Cluster — KRaft mode with Gateway API listener
#
# Listener "gateway" is type: cluster-ip on port 9092 with:
#   - SCRAM-SHA-512 authentication
#   - TLS using the cert-manager certificate
#   - Per-broker advertisedHost pointing to the external DNS names
#     that will be routed via Envoy Gateway TLSRoutes
#
# The brokers get IDs 10, 11, 12 (from the broker node pool annotation).
# Each broker advertises: broker-<ID>.kafka.aks.mydomain.com:9092
###############################################################################
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: gateway-api-kafka
  namespace: strimzi
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    authorization:
      type: simple
    listeners:
    - name: gateway
      port: 9092
      type: cluster-ip
      tls: true
      authentication:
        type: scram-sha-512
      configuration:
        createBootstrapService: true
        brokerCertChainAndKey:
          certificate: tls.crt
          key: tls.key
          secretName: kafka-certificate
        brokers:
        - broker: 10
          advertisedHost: broker-10.kafka.aks.mydomain.com
          advertisedPort: 9092
        - broker: 11
          advertisedHost: broker-11.kafka.aks.mydomain.com
          advertisedPort: 9092
        - broker: 12
          advertisedHost: broker-12.kafka.aks.mydomain.com
          advertisedPort: 9092
    version: 4.1.0
