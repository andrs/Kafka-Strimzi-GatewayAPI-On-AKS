###############################################################################
# Self-signed ClusterIssuer + Wildcard Certificate
#
# The wildcard *.kafka.aks.mydomain.com covers:
#   - bootstrap.kafka.aks.mydomain.com  (bootstrap)
#   - broker-10.kafka.aks.mydomain.com  (broker 0)
#   - broker-11.kafka.aks.mydomain.com  (broker 1)
#   - broker-12.kafka.aks.mydomain.com  (broker 2)
###############################################################################
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kafka-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-certificate
  namespace: strimzi
spec:
  secretName: kafka-certificate
  subject:
    organizations:
    - kafka-aks-poc
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
  - server auth
  - client auth
  dnsNames:
  - '*.kafka.aks.mydomain.com'
  issuerRef:
    name: kafka-selfsigned-issuer
    kind: ClusterIssuer
